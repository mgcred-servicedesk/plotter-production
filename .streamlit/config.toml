# Configuracao do Streamlit para deploy no Streamlit Cloud
# base = "light" fixado para impedir que o Streamlit detecte o tema
# do sistema operacional e aplique dark mode nativo — o controle
# visual de light/dark e feito inteiramente pelo CSS customizado (--mg-*).
#
# Paleta OKLCH aproximada em hex — Streamlit native nao suporta oklch().
# Cores da marca aplicadas aos widgets nativos no modo light; o modo
# dark segue controlado pelo CSS customizado (--mg-*).
#
# ATENCAO: NAO definir uma secao [theme.dark] aqui. Desde o Streamlit
# 1.46+, a presenca de [theme.dark] ativa o tema dual nativo: o
# frontend passa a seguir prefers-color-scheme do SO e widgets nativos
# (botoes, pills, componentes custom) escurecem sozinhos enquanto o
# CSS customizado continua no light — visual quebrado (bug 2026-07-07).
# A paleta dark para futura migracao ao tema nativo dual esta
# preservada em src/dashboard/ui/theme.py (_NATIVE_THEME["dark"]).

[theme]
base = "light"
primaryColor = "#3366E6"
backgroundColor = "#FAFAF9"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1F2937"

[server]
headless = true

[client]
# Desliga o botao CSV nativo da toolbar de st.dataframe/st.data_editor
# e o copiar-para-clipboard (Streamlit 1.60+).
#
# NAO afeta os exports do projeto, que sao st.download_button:
# `botao_exportar_csv` (components/tables.py) e o export proprio de
# tabs/gestao_consultores.py. Esses continuam funcionando.
#
# Motivo: nao e seguranca — o botao da toolbar baixa o DataFrame que
# ja passou pelo RLS antes do render, o mesmo dado que esta na tela.
# E padronizacao: toda tabela ganhava um download implicito que ninguem
# decidiu oferecer, no formato default do Streamlit (virgula, sem BOM),
# que corrompe acento no Excel pt-BR. Os exports deliberados usam
# `sep=";"`, `decimal=","` e UTF-8 com BOM.
#
# Custo aceito: o copiar-para-clipboard das tabelas cai junto, e a
# opcao e app-wide (nao da para liberar em tabela especifica).
disableDataExport = true

[browser]
gatherUsageStats = false

[logger]
level = "info"
